title = "Olimpiada de Lingvistică din România"
description = "Olimpiada de Lingvistică din România"
default_language="ro"

# The URL the site will be built for
base_url = "https://olingv.ro"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library

theme = "duckquill"

taxonomies = [{ name = "tags", feed = false }]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
# highlight_code = true

[extra]
accent_color="#0d78be"
styles=[
    "custom_style.css",
]

[extra.nav]
# Display Atom/RSS feed button in the nav
show_theme_switcher = true
# Whether to use icons in the nav
icons = true
show_facebook = true
fb_url = "https://www.facebook.com/olimpiadadelingvistica"
show_mail = true
mailto = "mailto:olimpiada.lingvistica@gmail.com"
# Links used in the nav; any icon from https://icons.getbootstrap.com
# can be used as the icon. The bi- prefix should not be added.
links = [
  {url = "/despre", name = "Despre", menu = [
#    {url = "/despre#istoria-olimpiadei", name = "Istoria Olimpiadei"},
    {url = "/despre#inscrieri", name = "Înscrieri"},
    {url = "/despre#regulament", name = "Regulament"}
  ]},
  {url = "/blog", name = "Articole"},
  {url = "/resurse", name = "Resurse"},
]


[extra.footer]
show_powered_by = true
show_copyright = true



